# Onboarding Buddy Application Configuration

# ============================================================
# Database Configuration
# ============================================================
db.url=jdbc:mysql://localhost:3306/onboard_buddy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=appuser
db.password=apppassword
db.driver=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
db.pool.maxSize=20
db.pool.minIdle=5
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000

# ============================================================
# Server Configuration
# ============================================================
server.port=8080
server.contextPath=/
server.maxThreads=200
server.minSpareThreads=10

# ============================================================
# JWT Configuration
# ============================================================
jwt.secret=onboard-buddy-secret-key-change-this-in-production-min-256-bits-required
jwt.expiration=86400000
jwt.refreshExpiration=604800000
jwt.issuer=onboard-buddy-app

# ============================================================
# CORS Configuration
# ============================================================
# Allow all origins in development (use specific origins in production)
cors.allowedOrigins=*
cors.allowedMethods=GET,POST,PUT,DELETE,OPTIONS
cors.allowedHeaders=*
cors.allowCredentials=false
cors.maxAge=3600

# ============================================================
# File Upload Configuration
# ============================================================
upload.maxFileSize=10485760
upload.directory=/var/onboard-buddy/uploads
upload.allowedExtensions=jpg,jpeg,png,pdf,doc,docx

# ============================================================
# Session Configuration
# ============================================================
session.timeout=1800
session.maxConcurrent=3
session.cleanupInterval=300

# ============================================================
# Logging Configuration
# ============================================================
logging.level=INFO
logging.file=/var/log/onboard-buddy/application.log
logging.maxFileSize=10MB
logging.maxHistory=30

# ============================================================
# Email Configuration (Optional)
# ============================================================
email.enabled=false
email.host=smtp.gmail.com
email.port=587
email.username=
email.password=
email.from=noreply@onboardbuddy.com

# ============================================================
# Application Configuration
# ============================================================
app.name=Onboard Buddy
app.version=1.0.0
app.environment=development
app.baseUrl=http://localhost:8080

# Password Policy
password.minLength=8
password.requireUppercase=true
password.requireLowercase=true
password.requireDigit=true
password.requireSpecialChar=true
password.expirationDays=90
password.historyCount=5

# Buddy Matching
matching.algorithm=skill-based
matching.scoreThreshold=0.7

# Rate Limiting
rate.limit.enabled=true
rate.limit.requestsPerMinute=60
rate.limit.loginAttempts=203

# Notifications
notification.enabled=true
notification.batchSize=50
notification.retryAttempts=3

# Security
csrf.enabled=false
csrf.tokenValidity=3600
